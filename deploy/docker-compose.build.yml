# Build override used only on the build host by build-export.sh.
services:
  minio:
    build:
      context: ..
      dockerfile: deploy/minio/Dockerfile
      args:
        MINIO_RELEASE: ${MINIO_RELEASE:-RELEASE.2025-10-15T17-29-55Z}
  backend:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
