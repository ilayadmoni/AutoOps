# AutoOps stack. Run from the repository root:
#   docker compose -f deploy/docker-compose.yml up -d --pull never
# Replace every environment value starting with REPLACE before starting containers.
# Optional values must be replaced with "" when unused. No .env file is needed.
name: autoops


services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: "REPLACE: Database name, e.g. autoops; use the same database in backend DATABASE_URL"
      POSTGRES_USER: "REPLACE: Database username, e.g. autoops; same as backend DATABASE_USERNAME"
      POSTGRES_PASSWORD: "REPLACE: Strong database password; same as backend DATABASE_PASSWORD"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    # Load the pinned MinIO image exported by build-export.sh before starting.
    # To use an existing S3-compatible service instead, point MINIO_ENDPOINT at it and remove this service.
    image: autoops-minio:RELEASE.2025-10-15T17-29-55Z
    environment:
      MINIO_ROOT_USER: "REPLACE: MinIO access key, e.g. autoops; same as backend MINIO_ACCESS_KEY"
      MINIO_ROOT_PASSWORD: "REPLACE: MinIO secret key, at least 8 characters; same as backend MINIO_SECRET_KEY"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    image: autoops-backend:latest
    environment:
      DATABASE_URL: "REPLACE: JDBC URL, e.g. jdbc:postgresql://postgres:5432/autoops; database must match POSTGRES_DB"
      DATABASE_USERNAME: "REPLACE: Database username; same as postgres POSTGRES_USER"
      DATABASE_PASSWORD: "REPLACE: Database password; same as postgres POSTGRES_PASSWORD"
      JWT_SECRET: "REPLACE: Random JWT signing secret, at least 32 bytes"
      JWT_ACCESS_EXPIRATION: "REPLACE: Access token lifetime in milliseconds, e.g. 900000"
      JWT_REFRESH_EXPIRATION: "REPLACE: Refresh token lifetime in milliseconds, e.g. 604800000"
      COOKIE_SECURE: "true"
      AUTOOPS_ADMIN_USERNAME: "REPLACE: Initial administrator username, e.g. admin"
      AUTOOPS_ADMIN_PASSWORD: "REPLACE: Initial administrator password, at least 10 characters, not a default password"
      CREDENTIAL_ENCRYPTION_KEY: "REPLACE: Random encryption secret, at least 16 characters; keep stable to preserve stored credentials"
      AI_BASE_URL: "REPLACE: OpenAI-compatible API base URL, e.g. https://openrouter.ai/api/v1"
      AI_API_KEY: "REPLACE: AI provider API key; use an empty string to disable AI"
      AI_MODEL: "REPLACE: AI model identifier; use an empty string when AI is disabled"
      AI_SSL_VERIFY: "REPLACE: true to verify TLS certificates"
      AI_SSL_CERT_PATH: "REPLACE: Container CA certificate path, e.g. /app/certs/provider-ca.pem; or an empty string for default trust"
      EMBEDDING_PROVIDER: "REPLACE: LOCAL for offline embeddings, or OPENAI_COMPATIBLE for an external provider"
      EMBEDDING_MODEL: "REPLACE: Embedding model identifier (384 dimensions); empty string for LOCAL"
      EMBEDDING_BASE_URL: "REPLACE: Embedding provider API base URL; empty string for LOCAL"
      EMBEDDING_API_KEY: "REPLACE: Embedding provider API key; empty string for LOCAL"
      MINIO_ENDPOINT: "REPLACE: S3 endpoint, e.g. http://minio:9000 for the included service"
      MINIO_ACCESS_KEY: "REPLACE: MinIO access key; same as minio MINIO_ROOT_USER"
      MINIO_SECRET_KEY: "REPLACE: MinIO secret key; same as minio MINIO_ROOT_PASSWORD"
      MINIO_BUCKET: "REPLACE: Storage bucket name, e.g. autoops"
      FILES_MAX_SIZE: "REPLACE: Maximum uploaded file size, e.g. 100MB; keep within Nginx upload limit of 110m"
      FILES_ORPHAN_RETENTION_DAYS: "REPLACE: Orphan file retention in days, e.g. 7"
      DATASET_MAX_SIZE: "REPLACE: Maximum dataset upload size, e.g. 20MB"
      EXECUTION_MAX_CONCURRENCY: "REPLACE: Maximum concurrent machines per execution, integer from 1 to 3, e.g. 3"
      EXECUTION_WORKER_THREADS: "REPLACE: Total concurrent machine jobs, e.g. 24"
      EXECUTION_APPROVAL_TIMEOUT_MINUTES: "REPLACE: Approval timeout in minutes, e.g. 1440"
      EXECUTION_MAX_OUTPUT_BYTES: "REPLACE: Maximum captured output bytes per stream, e.g. 65536"
    volumes:
      - type: bind
        source: ./certs
        target: /app/certs
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped

  frontend:
    image: autoops-frontend:latest
    ports:
      - "443:443"
    volumes:
      - type: bind
        source: ./tls/server.crt
        target: /etc/nginx/tls/server.crt
        read_only: true
      - type: bind
        source: ./tls/server.key
        target: /etc/nginx/tls/server.key
        read_only: true
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data: {}
  minio-data: {}
