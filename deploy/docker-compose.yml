services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: autoops
      POSTGRES_USER: autoops
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-autoops}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U autoops"], interval: 5s, timeout: 5s, retries: 10}
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-autoops}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-autoops-secret}
    volumes: [minio-data:/data]
  backend:
    build: {context: .., dockerfile: deploy/backend/Dockerfile}
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/autoops
      DATABASE_USERNAME: autoops
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-autoops}
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    depends_on: {postgres: {condition: service_healthy}}
  frontend:
    build: {context: .., dockerfile: deploy/frontend/Dockerfile}
    ports: ['8088:80']
    depends_on: [backend]
volumes: {postgres-data: {}, minio-data: {}}
